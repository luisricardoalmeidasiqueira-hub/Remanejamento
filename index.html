<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1976d2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Remanejamento de Rota</title>

<style>
  :root{
    --bg:#fff; --panel:#fff; --panel-2:#f3f8fc; --line:#d8e5f0;
    --text:#183247; --text-dim:#60778a; --accent:#1976d2;
    --accent-dim:#c8def3; --accent-text:#fff; --red:#c85a40; --gray:#8a97a3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:Georgia,'Iowan Old Style',serif;
    min-height:100vh; padding:18px 14px 40px;
  }
  .wrap{max-width:480px;margin:0 auto}
  header{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  header h1{font-size:22px;font-weight:600;margin:0 0 4px;color:var(--accent)}
  header p{margin:0;color:var(--text-dim);font-size:13px;font-family:-apple-system,system-ui,sans-serif}
  .share-app-btn{width:100%;margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--accent-dim);background:var(--panel-2);color:var(--accent);font-family:-apple-system,system-ui,sans-serif;font-size:13px;font-weight:700;cursor:pointer}
  .share-app-btn:active{transform:scale(.99)}
  .card,.entry{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .card{padding:16px;margin-bottom:16px}
  label{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:12.5px;color:var(--text-dim);margin:14px 0 6px}
  label:first-of-type{margin-top:0}
  input[type="text"],textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-family:-apple-system,system-ui,sans-serif;font-size:16px;
    padding:11px 12px;appearance:none
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px}
  button{touch-action:manipulation}
  .save-btn,.export-btn,.toggle-etapas-btn,.add-medidor-btn,.foto-btn{cursor:pointer}
  .save-btn{
    width:100%;margin-top:18px;padding:14px;border-radius:8px;border:none;
    background:var(--accent);color:#fff;font-family:-apple-system,system-ui,sans-serif;
    font-size:15px;font-weight:700
  }
  .save-btn:disabled{background:var(--gray)}
  .status-msg{text-align:center;font-family:-apple-system,system-ui,sans-serif;font-size:13px;color:var(--text-dim);margin-top:10px;min-height:16px}
  .section-title{font-family:-apple-system,system-ui,sans-serif;font-size:13px;color:var(--text-dim);margin:26px 2px 10px;display:flex;justify-content:space-between}
  .count{color:var(--accent);font-weight:600}
  .filtro-rota{margin-bottom:12px}
  .filtro-rota input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
  .entry{border-left:3px solid var(--accent);padding:12px 14px;margin-bottom:10px;font-family:-apple-system,system-ui,sans-serif}
  .entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .entry-code{font-size:15px;font-weight:700;color:var(--accent)}
  .entry-date{font-size:12px;color:var(--text-dim);white-space:nowrap}
  .entry-meta{font-size:12.5px;color:var(--text-dim);margin-top:4px}
  .entry-rota{font-weight:600;color:var(--accent)}
  .entry-obs{margin-top:6px;font-size:12.5px;color:var(--text-dim);font-style:italic;border-top:1px solid var(--line);padding-top:6px}
  .foto-input-row{display:flex;gap:8px}
  .foto-btn{flex:1;padding:11px 8px;border-radius:8px;border:1px dashed var(--accent-dim);background:var(--panel-2);color:var(--accent);font-size:13px;font-weight:600}
  .foto-preview,.entry-fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .foto-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .foto-thumb img,.entry-fotos img{width:100%;height:100%;object-fit:cover;display:block}
  .foto-thumb .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:11px;line-height:18px;padding:0}
  .entry-fotos{gap:6px}
  .entry-fotos img{width:52px;height:52px;border-radius:6px;border:1px solid var(--line);cursor:pointer}
  .foto-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;align-items:center;justify-content:center;flex-direction:column;padding:20px}
  .foto-modal.open{display:flex}
  .foto-modal img{max-width:100%;max-height:70vh;border-radius:8px}
  .foto-modal-nav{display:flex;gap:14px;margin-top:16px}
  .foto-modal-nav button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 16px}
  .foto-modal-close{position:absolute;top:18px;right:18px;background:none;border:0;color:#fff;font-size:30px}
  .toggle-etapas-btn,.add-medidor-btn{
    width:100%;padding:9px;margin-top:8px;border-radius:8px;border:1px dashed var(--accent-dim);
    background:var(--panel-2);color:var(--accent);font-family:-apple-system,system-ui,sans-serif;font-size:13px;font-weight:600
  }
  .add-medidor-btn{margin-bottom:4px}
  .etapa-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .etapa-opts button{padding:7px 4px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);font-size:12px;font-weight:600}
  .etapa-opts button.selecionada{background:rgba(25,118,210,.15);border-color:var(--accent);color:var(--accent)}
  .medidor-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
  .medidor-row input{flex:1;min-width:0}
  .rm-medidor{background:var(--panel-2);border:1px solid var(--line);color:var(--red);border-radius:8px;width:38px;height:42px;font-size:17px}
  .medidor-status{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 18px;background:var(--gray)}
  .medidor-status.espelho{background:#1976d2;border-color:#1976d2}
  .medidor-status.nao-realizado{background:#d32f2f;border-color:#d32f2f}
  .medidor-status.concluido{background:#2e7d32;border-color:#2e7d32}
  .data-registro{display:flex;gap:8px;align-items:center}
  .data-registro input{flex:1}
  .meter-card{margin-top:9px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
  .meter-head{display:flex;align-items:center;gap:7px}
  .meter-num{font-weight:700;flex:1;min-width:0;word-break:break-all}
  .meter-status-text{font-size:11px;color:var(--text-dim);white-space:nowrap}
  .meter-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .meter-actions button{border:1px solid var(--line);background:var(--panel);color:var(--text-dim);border-radius:6px;padding:5px 7px;font-size:10.5px}
  .meter-actions button:hover{border-color:var(--accent)}
  .meter-tools{display:flex;gap:6px;margin-top:7px;justify-content:flex-end}
  .meter-tool{width:38px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:17px;cursor:pointer}
  .meter-tool.save{color:var(--accent)}
  .meter-tool.delete{color:var(--red)}
  .transfer-info{font-size:11px;color:var(--accent);margin-top:6px}
  .history-note{font-size:11px;color:var(--text-dim);margin-top:5px}
  .entry.digitado{opacity:.75;border-left-color:var(--gray)}
  .entry-status-row{display:flex;gap:8px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
  .entry-status-btn{flex:1;background:none;border:1px solid var(--gray);color:var(--gray);border-radius:6px;font-size:11.5px;font-weight:600;padding:7px 4px}
  .entry-status-btn.marcado{background:rgba(138,151,143,.15)}
  .entry-actions{display:flex;justify-content:flex-end;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
  .entry-del{background:none;border:0;color:var(--red);font-size:18px;padding:4px 2px;cursor:pointer}
  .empty{text-align:center;color:var(--text-dim);font-family:-apple-system,system-ui,sans-serif;font-size:13px;padding:30px 10px}
  .export-btn{width:100%;padding:11px;margin-bottom:14px;border-radius:8px;border:1px solid var(--accent-dim);background:transparent;color:var(--accent);font-size:13.5px;font-weight:600}
  .export-btn:disabled{color:var(--gray);border-color:var(--line);cursor:default}
  footer{text-align:center;margin-top:26px;color:var(--accent);font-family:-apple-system,system-ui,sans-serif;font-size:12px;opacity:.85}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <h1>Remanejamento de Rota</h1>
    <p>Cliente ligado no lugar certo, mas com rota errada no sistema</p>
    <button type="button" class="share-app-btn" id="shareAppBtn">↗️ Compartilhar aplicativo</button>
  </header>

  <div class="card">
    <button type="button" class="toggle-etapas-btn" id="toggleEtapasBtn">Mostrar etapas (1 a 18)</button>
    <div class="etapa-opts" id="etapaOpts" style="display:none"></div>

    <label>Número do medidor / UC</label>
    <div id="medidorList"></div>
    <button type="button" class="add-medidor-btn" id="addMedidorBtn">+ Adicionar medidor</button>

    <label for="dataRegistro">Data do registro</label>
    <div class="data-registro">
      <input type="date" id="dataRegistro">
    </div>

    <label for="vizinha">Medidor ou UC vizinha</label>
    <input type="text" id="vizinha" placeholder="Ex: 987600 (referência de local)" autocomplete="off">

    <label for="rotaDestino">Etapa/rota que vai ser remanejado</label>
    <input type="text" id="rotaDestino" placeholder="Ex: Rota 12 - Setor Norte" autocomplete="off">

    <label for="rua">Nome da rua</label>
    <input type="text" id="rua" placeholder="Ex: Rua das Flores" autocomplete="off">

    <label>Fotos</label>
    <div class="foto-input-row">
      <button type="button" class="foto-btn" id="fotoBtn">📷 Adicionar foto(s)</button>
      <input type="file" id="fotoInput" accept="image/*" multiple capture="environment" style="display:none">
    </div>
    <div class="foto-preview" id="fotoPreview"></div>

    <label for="obs">Observações</label>
    <textarea id="obs" placeholder="Detalhes adicionais (opcional)"></textarea>

    <button class="save-btn" id="saveBtn">💾 Salvar registro</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="section-title">
    <span>Registros salvos</span><span class="count" id="entryCount">0</span>
  </div>

  <div class="filtro-rota">
    <input type="text" id="filtroRota" placeholder="Filtrar por rota/etapa..." autocomplete="off">
  </div>

  <button class="export-btn" id="exportBtn">Exportar registros (CSV)</button>
  <div id="entriesList"></div>

  <footer>Desenvolvido por Luís Ricardo de Almeida Siqueira<br>© 2026 Luís Ricardo de Almeida Siqueira — Todos os direitos reservados.</footer>
</div>

<div class="foto-modal" id="fotoModal">
  <button class="foto-modal-close" id="fotoModalClose">×</button>
  <img id="fotoModalImg" src="" alt="Foto">
  <div class="foto-modal-nav" id="fotoModalNav" style="display:none">
    <button id="fotoModalPrev">‹ Anterior</button>
    <button id="fotoModalNext">Próxima ›</button>
  </div>
</div>

<script>
'use strict';

const CHAVE_DADOS = 'remanejamento-rota-entries';
let entries = [];
let filtroAtual = '';
let medidorValores = [''];
let selectedFotos = [];
let dataRegistro = todayStr();
let modalFotos = [];
let modalIndex = 0;

const $ = id => document.getElementById(id);

function formatDateHora(timestamp){
  if(!timestamp) return '';
  const d = new Date(timestamp);
  return d.toLocaleDateString('pt-BR') + ' ' +
         d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[ch]));
}

function renderMedidorRows(){
  $('medidorList').innerHTML = medidorValores.map((val,i)=>`
    <div class="medidor-row">
      <span class="medidor-status" title="Status do medidor"></span>
      <input type="text" inputmode="text" placeholder="Ex: 987654 ou UC 123456" class="medidor-input" data-i="${i}" value="${escapeHtml(val)}">
      ${`<button type="button" class="rm-medidor" data-i="${i}" title="Excluir somente este número (correção)">🗑️</button>`}
    </div>
  `).join('');

  $('medidorList').querySelectorAll('.medidor-input').forEach(inp=>{
    inp.addEventListener('input',()=>{ medidorValores[Number(inp.dataset.i)] = inp.value; });
  });
  $('medidorList').querySelectorAll('.rm-medidor').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=Number(btn.dataset.i);
      if(!medidorValores[i]) return;
      medidorValores.splice(i,1);
      if(!medidorValores.length) medidorValores=[''];
      renderMedidorRows();
    });
  });
}

$('addMedidorBtn').addEventListener('click',()=>{
  medidorValores.push('');
  renderMedidorRows();
});
renderMedidorRows();
$('dataRegistro').value=todayStr();
$('dataRegistro').addEventListener('change',e=>{ dataRegistro=e.target.value||todayStr(); });

$('etapaOpts').innerHTML = Array.from({length:18},(_,i)=>i+1)
  .map(n=>`<button type="button" data-etapa="${n}">${n}</button>`).join('');

$('toggleEtapasBtn').addEventListener('click',()=>{
  const aberto = $('etapaOpts').style.display !== 'none';
  $('etapaOpts').style.display = aberto ? 'none' : 'grid';
  $('toggleEtapasBtn').textContent = aberto ? 'Mostrar etapas (1 a 18)' : 'Ocultar etapas';
});

$('etapaOpts').querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    $('rotaDestino').value = btn.dataset.etapa;
    $('etapaOpts').querySelectorAll('button').forEach(b=>b.classList.remove('selecionada'));
    btn.classList.add('selecionada');
  });
});

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=900;
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',.6));
      };
      img.onerror=()=>reject(new Error('Falha ao carregar imagem'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('Falha ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

function renderFotoPreview(){
  $('fotoPreview').innerHTML = selectedFotos.map((foto,i)=>`
    <div class="foto-thumb">
      <img src="${foto}" alt="Foto ${i+1}">
      <button class="rm" data-i="${i}" type="button">×</button>
    </div>
  `).join('');
  $('fotoPreview').querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click',()=>{
      selectedFotos.splice(Number(btn.dataset.i),1);
      renderFotoPreview();
    });
  });
}

$('fotoBtn').addEventListener('click',()=>$('fotoInput').click());

$('fotoInput').addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]);
  for(const file of files){
    try{ selectedFotos.push(await compressImage(file)); }
    catch(err){ console.error(err); }
  }
  renderFotoPreview();
  e.target.value='';
});

function abrirModalFoto(fotos,index){
  modalFotos=fotos||[];
  modalIndex=index;
  atualizarModal();
  $('fotoModal').classList.add('open');
}
function atualizarModal(){
  if(!modalFotos.length)return;
  $('fotoModalImg').src=modalFotos[modalIndex];
  $('fotoModalNav').style.display=modalFotos.length>1?'flex':'none';
}
$('fotoModalClose').addEventListener('click',()=>$('fotoModal').classList.remove('open'));
$('fotoModal').addEventListener('click',e=>{
  if(e.target.id==='fotoModal')$('fotoModal').classList.remove('open');
});
$('fotoModalPrev').addEventListener('click',()=>{
  modalIndex=(modalIndex-1+modalFotos.length)%modalFotos.length;
  atualizarModal();
});
$('fotoModalNext').addEventListener('click',()=>{
  modalIndex=(modalIndex+1)%modalFotos.length;
  atualizarModal();
});

function limparFormulario(){
  medidorValores=['']; renderMedidorRows();
  dataRegistro=todayStr();
  $('dataRegistro').value=dataRegistro;
  $('vizinha').value='';
  $('rotaDestino').value='';
  $('rua').value='';
  $('obs').value='';
  selectedFotos=[]; renderFotoPreview();
  $('etapaOpts').style.display='none';
  $('toggleEtapasBtn').textContent='Mostrar etapas (1 a 18)';
  $('etapaOpts').querySelectorAll('button').forEach(b=>b.classList.remove('selecionada'));
}

function lerDados(){
  try{
    const raw=localStorage.getItem(CHAVE_DADOS);
    if(!raw)return [];
    const dados=JSON.parse(raw);
    return Array.isArray(dados)?dados:[];
  }catch(e){
    console.error('Erro ao ler registros',e);
    return [];
  }
}

function salvarDados(){
  try{
    localStorage.setItem(CHAVE_DADOS,JSON.stringify(entries));
    return true;
  }catch(e){
    console.error('Erro ao salvar registros',e);
    return false;
  }
}

function normalizarMedidores(e){
  const lista=Array.isArray(e.medidores)?e.medidores:(e.medidor?[e.medidor]:[]);
  return lista.map((m,idx)=>{
    if(typeof m==='string'){
      return {
        id:(e.id||'m')+'-'+idx,
        numero:m,
        status:'pendente',
        statusEm:null,
        transferidoPara:null,
        origemId:null,
        origemData:null
      };
    }
    return {
      id:m.id||((e.id||'m')+'-'+idx),
      numero:String(m.numero??m.medidor??''),
      status:m.status||'pendente',
      statusEm:m.statusEm||null,
      transferidoPara:m.transferidoPara||null,
      origemId:m.origemId||null,
      origemData:m.origemData||null
    };
  }).filter(m=>m.numero);
}

function normalizarRegistros(){
  entries=entries.map(e=>({
    ...e,
    id:e.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
    medidores:normalizarMedidores(e),
    dataRegistro:e.dataRegistro || new Date(e.criadoEm||Date.now()).toISOString().slice(0,10),
    fotos:Array.isArray(e.fotos)?e.fotos:[],
    digitado:Boolean(e.digitado),
    digitadoEm:e.digitadoEm||null,
    criadoEm:e.criadoEm||Date.now()
  }));
}

function formatDateBR(iso){
  if(!iso)return '';
  const p=iso.split('-');
  return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso;
}
function statusLabel(status){
  return status==='espelho'?'Espelho':status==='nao-realizado'?'Não realizado':status==='concluido'?'Concluído':'Pendente';
}
function statusClass(status){
  return status==='espelho'?'espelho':status==='nao-realizado'?'nao-realizado':status==='concluido'?'concluido':'';
}
function proximoMes(iso){
  const d=new Date((iso||todayStr())+'T12:00:00');
  d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function setMedidorStatus(entryId,medidorId,status){
  const entry=entries.find(e=>e.id===entryId);
  const m=entry?.medidores.find(x=>x.id===medidorId);
  if(!m)return;
  m.status=status;
  m.statusEm=Date.now();
  salvarDados(); renderEntries();
}
function transferirMedidor(entryId,medidorId){
  const entry=entries.find(e=>e.id===entryId);
  const m=entry?.medidores.find(x=>x.id===medidorId);
  if(!entry||!m)return;
  if(m.status==='concluido')return;
  const destino=proximoMes(entry.dataRegistro);
  m.transferidoPara=destino;
  if(m.status==='pendente')m.status='nao-realizado';
  m.statusEm=Date.now();

  const novo={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    medidores:[{
      id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      numero:m.numero,
      status:'pendente',
      statusEm:null,
      transferidoPara:null,
      origemId:entry.id,
      origemData:entry.dataRegistro
    }],
    vizinha:entry.vizinha||'',
    rotaDestino:entry.rotaDestino||'',
    rua:entry.rua||'',
    obs:entry.obs||'',
    fotos:[],
    digitado:false,digitadoEm:null,
    dataRegistro:destino,
    criadoEm:Date.now()
  };
  entries.push(novo);
  salvarDados(); renderEntries();
}
function historicoMedidor(numero){
  return entries
    .filter(e=>e.medidores.some(m=>m.numero===numero))
    .sort((a,b)=>(a.dataRegistro||'').localeCompare(b.dataRegistro||''));
}

function renderEntries(){
  const termo=filtroAtual.trim().toLowerCase();
  const filtradas=termo
    ? entries.filter(e=>{
        const base=[e.rotaDestino,e.rua,e.vizinha,e.dataRegistro,e.obs].join(' ').toLowerCase();
        const meds=(e.medidores||[]).map(m=>m.numero).join(' ').toLowerCase();
        return base.includes(termo)||meds.includes(termo);
      })
    : entries;

  $('entryCount').textContent=filtradas.length;
  $('exportBtn').disabled=entries.length===0;

  if(!filtradas.length){
    $('entriesList').innerHTML=`<div class="empty">${termo?'Nenhum registro encontrado.':'Nenhum registro ainda. Preencha o formulário acima.'}</div>`;
    return;
  }

  const sorted=[...filtradas].sort((a,b)=>(b.dataRegistro||'').localeCompare(a.dataRegistro||'') || (b.criadoEm||0)-(a.criadoEm||0));

  $('entriesList').innerHTML=sorted.map(e=>`
    <div class="entry">
      <div class="entry-top">
        <span class="entry-code">Medidor${e.medidores.length>1?'es':''}</span>
        <span class="entry-date">${formatDateBR(e.dataRegistro)} · ${formatDateHora(e.criadoEm)}</span>
      </div>
      <div class="entry-meta">
        ${e.medidores.map(m=>`
          <div class="meter-card">
            <div class="meter-head">
              <span class="medidor-status ${statusClass(m.status)}" title="${statusLabel(m.status)}"></span>
              <span class="meter-num">${escapeHtml(m.numero)}</span>
              <span class="meter-status-text">${statusLabel(m.status)}</span>
            </div>
            ${m.transferidoPara?`<div class="transfer-info">↪ Transferido para ${formatDateBR(m.transferidoPara)}</div>`:''}
            ${m.origemData?`<div class="history-note">↩ Pendência transferida de ${formatDateBR(m.origemData)}</div>`:''}
            <div class="meter-actions">
              <button data-action="espelho" data-id="${escapeHtml(e.id)}" data-mid="${escapeHtml(m.id)}">🔵 Espelho</button>
              <button data-action="nao-realizado" data-id="${escapeHtml(e.id)}" data-mid="${escapeHtml(m.id)}">🔴 Não realizado</button>
              <button data-action="concluido" data-id="${escapeHtml(e.id)}" data-mid="${escapeHtml(m.id)}">🟢 Concluído</button>
              ${m.status!=='concluido'&&!m.transferidoPara?`<button data-action="transferir" data-id="${escapeHtml(e.id)}" data-mid="${escapeHtml(m.id)}">📅 Próximo mês</button>`:''}
            </div>
            <div class="meter-tools">
              <button type="button" class="meter-tool save" title="Salvar marcação" aria-label="Salvar marcação" data-action="salvar-marcacao" data-id="${escapeHtml(e.id)}" data-mid="${escapeHtml(m.id)}">💾</button>
              <button type="button" class="meter-tool delete" title="Excluir marcação" aria-label="Excluir marcação" data-action="excluir-marcacao" data-id="${escapeHtml(e.id)}" data-mid="${escapeHtml(m.id)}">🗑️</button>
            </div>
          </div>
        `).join('')}
      </div>
      ${e.vizinha?`<div class="entry-meta">UC vizinha <strong>${escapeHtml(e.vizinha)}</strong></div>`:''}
      <div class="entry-meta">Remanejar para: <span class="entry-rota">${escapeHtml(e.rotaDestino||'—')}</span>${e.rua?` · ${escapeHtml(e.rua)}`:''}</div>
      ${e.obs?`<div class="entry-obs">${escapeHtml(e.obs)}</div>`:''}
      ${e.fotos.length?`<div class="entry-fotos" data-entry-id="${escapeHtml(e.id)}">${e.fotos.map((f,i)=>`<img src="${f}" data-i="${i}" alt="Foto">`).join('')}</div>`:''}
      ${e.digitado&&e.digitadoEm?`<div class="entry-meta">Digitado em ${formatDateHora(e.digitadoEm)}</div>`:''}
      <div class="entry-status-row">
        <button class="entry-status-btn${e.digitado?' marcado':''}" data-action="digitado" data-id="${escapeHtml(e.id)}">
          ${e.digitado?'Digitado ✓':'Marcar digitado'}
        </button>
      </div>
    </div>
  `).join('');


  $('entriesList').querySelectorAll('.entry-fotos').forEach(container=>{
    const entry=entries.find(e=>e.id===container.dataset.entryId);
    if(!entry)return;
    container.querySelectorAll('img').forEach(img=>{
      img.addEventListener('click',()=>abrirModalFoto(entry.fotos,Number(img.dataset.i)));
    });
  });

  $('entriesList').querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const action=btn.dataset.action;
      if(action==='digitado'){
        const entry=entries.find(e=>e.id===btn.dataset.id);
        if(!entry)return;
        entry.digitado=!entry.digitado;
        entry.digitadoEm=entry.digitado?Date.now():null;
        salvarDados(); renderEntries(); return;
      }
      if(action==='transferir'){
        if(window.confirm('Transferir este medidor para o próximo mês? O histórico atual será mantido.')) transferirMedidor(btn.dataset.id,btn.dataset.mid);
        return;
      }
      if(action==='salvar-marcacao'){
        const entry=entries.find(e=>e.id===btn.dataset.id);
        const m=entry?.medidores.find(x=>x.id===btn.dataset.mid);
        if(!entry||!m)return;
        m.statusEm=m.statusEm||Date.now();
        salvarDados();
        const status=$('statusMsg');
        status.textContent='Marcação salva.';
        status.style.color='var(--accent)';
        setTimeout(()=>status.textContent='',1800);
        return;
      }
      if(action==='excluir-marcacao'){
        const entry=entries.find(e=>e.id===btn.dataset.id);
        const m=entry?.medidores.find(x=>x.id===btn.dataset.mid);
        if(!entry||!m)return;
        if(!window.confirm('Excluir somente a marcação deste medidor? O número e o histórico serão mantidos.'))return;
        m.status='pendente';
        m.statusEm=null;
        m.transferidoPara=null;
        salvarDados();
        renderEntries();
        return;
      }
      setMedidorStatus(btn.dataset.id,btn.dataset.mid,action);
    });
  });
}

$('shareAppBtn').addEventListener('click', async ()=>{
  const shareData={
    title:'Remanejamento de Rota',
    text:'Aplicativo Remanejamento de Rota',
    url:window.location.href
  };
  try{
    if(navigator.share){
      await navigator.share(shareData);
      return;
    }
    await navigator.clipboard.writeText(window.location.href);
    const status=$('statusMsg');
    status.textContent='Link do aplicativo copiado para compartilhar.';
    status.style.color='var(--accent)';
  }catch(err){
    if(err && err.name==='AbortError') return;
    try{
      window.prompt('Copie o link do aplicativo:',window.location.href);
    }catch(e){}
  }
});

$('filtroRota').addEventListener('input',e=>{
  filtroAtual=e.target.value;
  renderEntries();
});

$('saveBtn').addEventListener('click',()=>{
  const medidores=medidorValores.map(v=>v.trim()).filter(Boolean);
  const data=$('dataRegistro').value||todayStr();
  const vizinha=$('vizinha').value.trim();
  const rotaDestino=$('rotaDestino').value.trim();
  const rua=$('rua').value.trim();
  const obs=$('obs').value.trim();
  const status=$('statusMsg');
  const btn=$('saveBtn');

  btn.disabled=true;
  status.textContent='Salvando...';
  status.style.color='var(--text-dim)';

  const novo={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    medidores:medidores.map((numero,i)=>({
      id:'m'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,4),
      numero,status:'pendente',statusEm:null,transferidoPara:null,origemId:null,origemData:null
    })),
    dataRegistro:data,
    vizinha,rotaDestino,rua,obs,
    fotos:[...selectedFotos],
    digitado:false,digitadoEm:null,criadoEm:Date.now()
  };

  entries.push(novo);

  if(!salvarDados()){
    entries.pop();
    btn.disabled=false;
    status.textContent='Não foi possível salvar. Verifique o armazenamento do navegador.';
    status.style.color='var(--red)';
    return;
  }

  renderEntries();
  limparFormulario();
  btn.disabled=false;
  status.textContent='Registro salvo com sucesso.';
  status.style.color='var(--accent)';
  setTimeout(()=>status.textContent='',2500);
});

function escapeCsv(valor){
  const str=String(valor??'');
  if(/[;"\n\r]/.test(str))return '"'+str.replace(/"/g,'""')+'"';
  return str;
}

function exportarCSV(){
  if(!entries.length)return;
  const cabecalho=[
    'Número(s) do medidor','Status dos medidores','Medidor/UC vizinha','Rota de destino','Rua',
    'Data do registro','Observações','Lançado em','Qtd. fotos','Digitado','Digitado em'
  ];
  const linhas=[...entries].sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0)).map(e=>[
    (e.medidores||[]).map(m=>m.numero).join(' | '),
    (e.medidores||[]).map(m=>m.numero+': '+statusLabel(m.status)).join(' | '),
    e.vizinha||'',e.rotaDestino||'',e.rua||'',e.dataRegistro||'',
    e.obs||'',formatDateHora(e.criadoEm),e.fotos?e.fotos.length:0,
    e.digitado?'Sim':'Não',e.digitado?formatDateHora(e.digitadoEm):''
  ].map(escapeCsv).join(';'));

  const csv='\uFEFF'+[cabecalho.join(';'),...linhas].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`remanejamento-rota-${todayStr()}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('exportBtn').addEventListener('click',exportarCSV);

entries=lerDados();
normalizarRegistros();
if(entries.length)salvarDados();
renderEntries();
</script>
